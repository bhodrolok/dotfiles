# ── Tsugumori Terminal — Kitty Config ──
# https://github.com/Aleph1-9012/Tsugumori/blob/main/config/kitty/kitty.conf
# Font
# font_family      Share Tech Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Sidonia sepia palette
foreground            #e8e8e8
background            #0a0a0a
selection_foreground  #0a0a0a
selection_background  #e8e8e8

# Cursor
cursor                #cc1515
cursor_trail          3
cursor_trail_decay    0.1 0.4
cursor_text_color     #0a0a0a
cursor_shape          block
cursor_blink_interval 0.8

# ANSI colors — sepia/dark palette
color0   #0a0a0a
color1   #cc1515
color2   #7a8faa
color3   #c8c8c4
color4   #7a8faa
color5   #9e1010
color6   #7a8faa
color7   #e8e8e8
color8   #2a2a2a
color9   #9e1010
color10  #7a8faa
color11  #c8c8c4
color12  #7a8faa
color13  #cc1515
color14  #909090
color15  #e8e8e8

# Window
window_padding_width     15
background_opacity       0.92

# Tabs — hidden for a clean layout
# tab_bar_style hidden

# Disable the bell
enable_audio_bell no
visual_bell_duration 0.0

# Url
url_color   #7a8faa
url_style   single

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings for common actions
map ctrl+shift+n new_window
map ctrl+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Move cursor word by word using Ctrl + Left/Right arrows
map ctrl+left send_text all \x1b\x62
map ctrl+right send_text all \x1b\x66

# Tab configuration
tab_bar_style powerline
# tab_bar_align left

# Shell integration
shell_integration enabled
